name: Pages Smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production URL
        run: |
          set -euo pipefail
          url="https://custom-gpt-chrome-mcp-agent.pages.dev/"
          body="$(curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors "$url")"
          grep -F "Chrome DevTools MCP × Custom GPT" <<<"$body"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --location "$url")"
          test "$status" = "200"
          echo "Production URL returned HTTP $status"
